[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rechip01"
version = "0.1.0"
description = "Simulation-first reliability assessment and disposition decisions for retired AI servers and GPUs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Richard Lu", email = "guangl2011@gmail.com" }]
keywords = ["reliability", "gpu", "itad", "predictive-maintenance", "simulation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.14",
    "ruff==0.17.3",
    "mypy==2.4.1",
]
server = [
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/guangl2011/reChip01"

[tool.hatch.build.targets.wheel]
packages = ["src/rechip01"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["numpy.*", "scipy.*", "sklearn.*", "uvicorn.*"]
ignore_missing_imports = true
